<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b5c" />
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring with Subtle Shadow -->
  <circle cx="80" cy="80" r="74" fill="url(#badgeBlue)" filter="url(#badgeShadow)" />
  <circle cx="80" cy="80" r="69" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.6" fill="none"/>
  <circle cx="80" cy="80" r="63" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Top Text: STENCU COFFEE -->
  <!-- We use curved path for text -->
  <path id="topCurve" d="M 28 80 A 52 52 0 0 1 132 80" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="3.2">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">STENCU COFFEE</textPath>
  </text>

  <!-- Center Artwork: Coffee Cup & Rising Steam -->
  <!-- Steam -->
  <path d="M72 48 C70 53, 74 55, 72 59" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M80 45 C77 51, 83 53, 80 59" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M88 48 C86 53, 90 55, 88 59" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cup -->
  <path d="M66 62 H94 L91.5 81 C91 86, 86.5 89, 80 89 C73.5 89, 69 86, 68.5 81 Z" fill="#ffffff"/>
  <!-- Handle -->
  <path d="M94 65 H98 C101.5 65, 103 67.5, 103 70.5 C103 73.5, 101.5 76, 98 76 H92.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Saucer -->
  <path d="M62 90 C70 94, 90 94, 98 90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Coffee Bean Inside Cup -->
  <path d="M80 69 C77.5 69, 75.5 72, 75.5 75.5 C75.5 79, 77.5 82, 80 82 C82.5 82, 84.5 79, 84.5 75.5 C84.5 72, 82.5 69, 80 69 Z" fill="#0f2b5c"/>
  <path d="M80 70.5 C78 73.5, 82 77.5, 80 80.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Bottom Stars and Location -->
  <circle cx="48" cy="112" r="2" fill="#38bdf8"/>
  <circle cx="112" cy="112" r="2" fill="#38bdf8"/>
  
  <path id="bottomCurve" d="M 36 86 A 48 48 0 0 0 124 86" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9" fill="#93c5fd" letter-spacing="2.5">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">BATUPHAT • ACEH</textPath>
  </text>
</svg>
