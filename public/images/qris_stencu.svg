<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .qris-header { fill: #ed1c24; }
      .text-bold { font-family: 'Arial', sans-serif; font-weight: bold; }
      .text-regular { font-family: 'Arial', sans-serif; }
    </style>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="400" height="500" rx="20" class="bg" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- QRIS Header Banner -->
  <path d="M 0 20 Q 0 0 20 0 L 380 0 Q 400 0 400 20 L 400 65 L 0 65 Z" fill="#b91c1c"/>
  <text x="200" y="42" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4" font-family="'Arial Black', sans-serif">QRIS</text>
  <text x="200" y="56" fill="#fecaca" font-size="9" text-anchor="middle" letter-spacing="1" font-family="sans-serif">PEMBAYARAN DIGITAL NASIONAL</text>

  <!-- Merchant Info -->
  <text x="200" y="95" fill="#0f2b5c" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif">STENCU COFFEE</text>
  <text x="200" y="112" fill="#64748b" font-size="11" text-anchor="middle" font-family="monospace">NMID : ID1020261122334</text>
  <text x="200" y="128" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Batuphat Barat, Muara Satu, Lhokseumawe</text>

  <!-- QR Code Container Box -->
  <rect x="70" y="145" width="260" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Realistic QR Code Matrix Pattern -->
  <g fill="#0f172a" transform="translate(85, 160)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#0f172a"/>
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="20" y="20" width="20" height="20" rx="2" fill="#0f172a"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="170" y="0" width="60" height="60" rx="8" fill="#0f172a"/>
    <rect x="180" y="10" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="190" y="20" width="20" height="20" rx="2" fill="#0f172a"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="170" width="60" height="60" rx="8" fill="#0f172a"/>
    <rect x="10" y="180" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="20" y="190" width="20" height="20" rx="2" fill="#0f172a"/>

    <!-- Timing & Alignment Patterns -->
    <rect x="75" y="25" width="10" height="10" />
    <rect x="100" y="25" width="10" height="10" />
    <rect x="125" y="25" width="10" height="10" />
    <rect x="145" y="25" width="10" height="10" />

    <rect x="25" y="75" width="10" height="10" />
    <rect x="25" y="100" width="10" height="10" />
    <rect x="25" y="125" width="10" height="10" />
    <rect x="25" y="145" width="10" height="10" />

    <!-- Center QR Data Blocks -->
    <rect x="75" y="75" width="20" height="20" rx="2"/>
    <rect x="105" y="75" width="15" height="15"/>
    <rect x="135" y="75" width="20" height="20" rx="2"/>

    <rect x="75" y="105" width="15" height="15"/>
    <rect x="100" y="100" width="30" height="30" rx="4" fill="#b91c1c"/>
    <rect x="105" y="105" width="20" height="20" rx="2" fill="#ffffff"/>
    <text x="115" y="120" fill="#b91c1c" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">S</text>
    <rect x="140" y="105" width="15" height="15"/>

    <rect x="75" y="135" width="20" height="20" rx="2"/>
    <rect x="105" y="135" width="15" height="15"/>
    <rect x="135" y="135" width="20" height="20" rx="2"/>

    <!-- Additional QR noise matrix -->
    <rect x="175" y="75" width="12" height="12"/>
    <rect x="200" y="75" width="15" height="15"/>
    <rect x="175" y="100" width="15" height="15"/>
    <rect x="205" y="105" width="12" height="12"/>
    <rect x="175" y="130" width="20" height="15"/>
    <rect x="205" y="130" width="15" height="20"/>

    <rect x="75" y="175" width="15" height="15"/>
    <rect x="100" y="175" width="20" height="15"/>
    <rect x="130" y="175" width="15" height="20"/>
    <rect x="160" y="175" width="20" height="15"/>
    <rect x="195" y="175" width="15" height="15"/>

    <rect x="75" y="200" width="20" height="15"/>
    <rect x="105" y="200" width="15" height="20"/>
    <rect x="130" y="205" width="20" height="15"/>
    <rect x="160" y="200" width="15" height="15"/>
    <rect x="185" y="205" width="20" height="15"/>
    <rect x="215" y="200" width="15" height="15"/>
  </g>

  <!-- Bottom Badges (GPN, BSI, Bank Aceh) -->
  <line x1="50" y1="425" x2="350" y2="425" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="200" y="445" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Mendukung Seluruh Bank &amp; E-Wallet</text>
  <g transform="translate(70, 458)">
    <rect x="0" y="0" width="60" height="24" rx="4" fill="#f1f5f9"/>
    <text x="30" y="16" fill="#0f2b5c" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">BSI</text>
    
    <rect x="70" y="0" width="60" height="24" rx="4" fill="#f1f5f9"/>
    <text x="100" y="16" fill="#0f2b5c" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">BANK ACEH</text>

    <rect x="140" y="0" width="60" height="24" rx="4" fill="#f1f5f9"/>
    <text x="170" y="16" fill="#008037" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">GOPAY</text>

    <rect x="210" y="0" width="50" height="24" rx="4" fill="#f1f5f9"/>
    <text x="235" y="16" fill="#4c2a86" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">OVO</text>
  </g>
</svg>
