<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; }
      .text-sub { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; }
      .text-mono { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="400" height="520" rx="22" class="bg" stroke="#cbd5e1" stroke-width="2.5"/>
  
  <!-- QRIS Header Banner Resmi -->
  <path d="M 0 22 Q 0 0 22 0 L 378 0 Q 400 0 400 22 L 400 68 L 0 68 Z" fill="#b91c1c"/>
  <text x="200" y="44" fill="#ffffff" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="5" font-family="'Arial Black', Impact, sans-serif">QRIS</text>
  <text x="200" y="59" fill="#fecaca" font-size="9" text-anchor="middle" letter-spacing="1.5" font-family="sans-serif">PEMBAYARAN DIGITAL NASIONAL</text>

  <!-- Merchant Info Stencu Coffee -->
  <text x="200" y="98" fill="#0f2b5c" font-size="19" class="text-title" text-anchor="middle">STENCU COFFEE</text>
  <text x="200" y="116" fill="#475569" font-size="11" class="text-mono" text-anchor="middle">NMID : ID1020261122334</text>
  <text x="200" y="132" fill="#64748b" font-size="10" class="text-sub" text-anchor="middle">Batuphat Barat, Muara Satu, Kota Lhokseumawe</text>

  <!-- QR Code Container Box -->
  <rect x="65" y="145" width="270" height="270" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Actual Real QR Code Matrix Barcode -->
  <image href="data:image/png;base64," x="80" y="160" width="240" height="240" />

  <!-- Logo Badge Stencu Coffee di Tengah QR Code -->
  <rect x="180" y="260" width="40" height="40" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="200" cy="280" r="14" fill="#0f2b5c"/>
  <text x="200" y="285" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" font-family="'Arial Black', sans-serif">S</text>

  <!-- Bottom Notice & Bank/Wallet Badges (BSI Dihapus) -->
  <line x1="40" y1="432" x2="360" y2="432" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="200" y="452" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">Mendukung Seluruh Mobile Banking &amp; E-Wallet</text>
  
  <g transform="translate(45, 466)">
    <!-- GPN Badge -->
    <rect x="0" y="0" width="55" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="27.5" y="16" fill="#b91c1c" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">GPN</text>

    <!-- Bank Aceh Badge -->
    <rect x="63" y="0" width="75" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="100.5" y="16" fill="#0f2b5c" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">BANK ACEH</text>

    <!-- GoPay Badge -->
    <rect x="146" y="0" width="55" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="173.5" y="16" fill="#008037" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">GOPAY</text>

    <!-- OVO Badge -->
    <rect x="209" y="0" width="48" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="233" y="16" fill="#4c2a86" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">OVO</text>

    <!-- DANA Badge -->
    <rect x="265" y="0" width="48" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="289" y="16" fill="#118eea" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">DANA</text>
  </g>
</svg>
